name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: blood-backend-api
  JAVA_VERSION: '17'
  JAR_NAME: blood-donor-finder-0.0.1-SNAPSHOT.jar
  AZURE_CLIENT_ID: ''
  AZURE_TENANT_ID: ''
  AZURE_SUBSCRIPTION_ID: ''

permissions:
  contents: read
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Spring Boot project
        run: ./mvnw clean package -DskipTests

      - name: Verify JAR
        run: |
          ls -lh target/${{ env.JAR_NAME }}
          echo "Build successful"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/${{ env.JAR_NAME }}
          retention-days: 1


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Show files
        run: ls -lh

      - name: Skip deploy when Azure OIDC is not configured
        if: env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == ''
        run: echo "Skipping Azure deployment. Set AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID in this workflow before enabling deploy."

      - name: Login to Azure
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: '*.jar'

      - name: Deployment completed
        run: echo "Deployment successful"
